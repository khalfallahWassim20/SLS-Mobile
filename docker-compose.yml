services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sls
      POSTGRES_PASSWORD: sls_dev_only
      POSTGRES_DB: sls
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sls -d sls"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
